<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Junto – Maintenance</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Fonts used by Junto -->
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700|Roboto+Slab:300,700" rel="stylesheet">

    <style>
        :root {
            --orange: #FF7800;
            --emerald: #2A6667;
            --light-blue: #5ECEE6;
            --text-dark: #1D1D1D;
            --text-muted: #6b6b6b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Lato', sans-serif;
            background: #ffffff;
            color: var(--text-dark);
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status-container {
            text-align: center;
            max-width: 720px;
            padding: 60px 30px;
        }

        .logo {
            max-width: 260px;
            margin-bottom: 50px;
        }

        h1 {
            font-family: 'Roboto Slab', serif;
            font-size: 42px;
            font-weight: 300;
            margin: 0 0 20px;
            color: var(--emerald);
        }

        p {
            font-size: 18px;
            line-height: 28px;
            margin: 0 0 30px;
            color: var(--text-dark);
        }

        .status-note {
            font-size: 15px;
            font-weight: 300;
            color: var(--text-muted);
        }

        .accent {
            color: var(--orange);
            font-weight: 700;
        }

        @media (max-width: 640px) {
            h1 {
                font-size: 32px;
            }

            p {
                font-size: 16px;
            }

            .logo {
                max-width: 200px;
            }
        }
    </style>
</head>

<body>

    <main class="status-container">
        <img src="logo.jpg" alt="Junto" class="logo">

        <h1>Maintenance in Progress</h1>

        <p>
            Junto is currently unavailable while we perform scheduled maintenance.
            We are working to restore service as quickly as possible.
        </p>

        <div class="status-note">
            Thank you for your patience.<br />
            267.639.6900 | support@junto.net
        </div>
    </main>

</body>

</html>
